name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate-plugin.py
      - run: python3 scripts/validate-citations.py
      - run: bash skills/00-blog-writing-guardrails/eval/run-eval.sh
      - run: bash skills/03-structure-scannability/eval/run-eval.sh
      - run: bash skills/02-headlines-hooks/eval/run-eval.sh
      - run: bash skills/01-audience-topic-research/eval/run-eval.sh
      - run: bash skills/14-visual-content-accessibility/eval/run-eval.sh
      - run: bash skills/16-measurement-content-performance/eval/run-eval.sh
      - run: bash skills/10-eeat-credibility-signals/eval/run-eval.sh
      - run: bash skills/12-technical-b2b-blogging/eval/run-eval.sh
      - run: bash skills/06-storytelling-case-studies/eval/run-eval.sh
      - run: bash skills/11-data-driven-original-research/eval/run-eval.sh
