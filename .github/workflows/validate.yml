name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate-plugin.py
      - run: python3 scripts/validate-citations.py
      - run: python3 scripts/test_run_behavioral_eval.py
      - name: Run all skill evals
        run: |
          set -euo pipefail
          for s in skills/*/eval/run-eval.sh; do
            echo "== $s"
            bash "$s"
          done
